<div class="skill-category">
  <ul class="skill-iut-list">
    {% for skill in site.data.skillsBUT %}
      <li class="skill-iut-container">
        <img
          src="{{skill.image}}"
          alt="{{skill[page.lang].name}} icon"
          class="skill-iut-icon">
        <div class="skill-iut-title">
          {{ skill[page.lang].name }}
        </div>
        <div class="skill-iut-subtitle">
          {{ skill[page.lang].subtitle }}
        </div>
        <div class="skill-iut-description">
          {{ skill[page.lang].description }}
        </div>
      </li>
    {% endfor %}
  </ul>
</div>

<style>
  .skill-iut-list {
    margin: 0;
    padding: 0;
    list-style-type: none;
    display: grid;
    gap: 40px;
    grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr));
    grid-auto-rows: max-content;

    justify-content: center;

  }

  .skill-iut-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;

    justify-content: start;
    align-items: center;

    text-align: center;
    font-size: 1.1rem;

    transition: all 1.5s;

    opacity: 1;
    transform: translateY(0);

    padding: 10px;

    /* height: fit-content; */
    max-width: 400px;
    border: solid rgba(42, 208, 248, 1) 8px;
    border-radius: 15px;
    background: linear-gradient(to bottom right, #39b5f2, #00a9ff);
    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
    z-index: 1;
    color: white;

  }

  .skill-iut-container.off-screen {
    opacity: 0;
    transform: translateY(50%);
  }

  .skill-iut-container:hover {
    box-shadow: 0 8px 30px 0 rgba(0, 0, 0, 0.5);
  }


  .skill-iut-icon {
    width: 50px;
    height: 50px;
    object-fit: contain;
    padding: 10px;
    background-color: rgb(104, 225, 255);
    border-radius: 50%;
  }

  .skill-iut-title {
    font-size: 1.2rem;
    font-weight: bold;
  }

  .skill-iut-subtitle {
    font-size: 1.1rem;
    color: rgb(138, 242, 251);
    font-weight: bold;
  }

  .skill-iut-description {
    margin-top: auto;
    font-size: 1rem;
  }
</style>
